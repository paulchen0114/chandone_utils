<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代化預約系統</title>
    
    <!-- 引入 FullCalendar 6 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-gray: #f8fafc;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --break-pattern: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 10px, #f8fafc 10px, #f8fafc 20px);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-gray);
            color: var(--text-main);
            line-height: 1.5;
        }

        .app-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section h1 {
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* navbar */
        .nav-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0 20px;
        }

        .nav-link {
            padding: 8px 14px;
            border-radius: 8px;
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-link:hover {
            background-color: #f1f5f9;
        }

        .nav-link.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 側邊圖例 */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* 日曆容器 */
        .calendar-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 24px;
            border: 1px solid var(--border);
        }

        /* FullCalendar 深度美化 */
        .fc {
            --fc-border-color: #f1f5f9;
            --fc-button-bg-color: #ffffff;
            --fc-button-border-color: #e2e8f0;
            --fc-button-text-color: #475569;
            --fc-button-hover-bg-color: #f8fafc;
            --fc-button-active-bg-color: #f1f5f9;
            --fc-today-bg-color: #eff6ff;
        }

        .fc .fc-toolbar-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .fc .fc-button {
            font-weight: 500;
            text-transform: capitalize;
            padding: 8px 16px;
            box-shadow: none !important;
        }

        .fc .fc-button-primary:not(:disabled).fc-button-active, 
        .fc .fc-button-primary:not(:disabled):active {
            color: var(--primary);
            background-color: #eff6ff;
            border-color: var(--primary);
        }

        .fc .fc-col-header-cell {
            padding: 12px 0;
            background-color: #fcfcfd;
            font-weight: 600;
        }

        .fc-timegrid-slot {
            height: 4.5em !important;
        }

        .fc-timegrid-slot-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 休息時段樣式 */
        .break-time-bg {
            background: var(--break-pattern) !important;
            opacity: 0.8;
        }

        .break-time-event {
            border: none !important;
            box-shadow: none !important;
            pointer-events: none;
        }

        /* 選取範圍樣式 */
        .fc-highlight {
            background: rgba(59, 130, 246, 0.1) !important;
        }

        /* 簡單的 tab / navbar 樣式 */
        .nav-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0 20px;
        }
        .nav-link {
            padding: 8px 14px;
            border-radius: 8px;
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-link.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .tab-content { display: block; }
        .tab-content.hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    

    <!-- navbar for tabs -->
    <nav class="nav-tabs" role="tablist" aria-label="主選單">
        <a class="nav-link active" data-tab="tab-calendar" href="#" role="tab">預約日曆</a>
        <a class="nav-link" data-tab="tab-settings" href="#" role="tab">相簿</a>
        <a class="nav-link" data-tab="tab-about" href="#" role="tab">說明</a>
    </nav>
    
    <!-- 授權連結（會由腳本填入正確的 base URL） -->
    <div style="text-align: right; margin-bottom: 12px;">
        <a id="auth-link" href="https://mysite-e425.onrender.com/authorize" class="auth-button">授權</a>
    </div>
    
    <!-- tab: calendar -->
    <section id="tab-calendar" class="tab-content">
        <div class="header-section">
            <h1>預約時段查詢</h1>
            <p>選擇一個合適的時間，開啟您的服務行程</p>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="dot" style="background: #cbd5e1;"></span> 忙碌/已過期</div>
            <div class="legend-item"><span class="dot" style="background: #f1f5f9; border: 1px dashed #cbd5e1;"></span> 休息時間</div>
            <div class="legend-item"><span class="dot" style="background: var(--primary);"></span> 您的選擇</div>
        </div>
        <div class="calendar-card">
            <div id="calendar"></div>
        </div>
    </section>
    
    <!-- tab: settings -->
    <section id="tab-settings" class="tab-content hidden" aria-hidden="true">
     
        <!-- 2. 前端 展示介面 (支援多相簿切換與燈箱) -->
        <section class="py-12 bg-slate-50 min-h-screen">
            <div class="max-w-7xl mx-auto px-4">
                <div class="text-center mb-10">
                    <h2 class="text-3xl font-bold mb-4">數位專案相簿群組</h2>
                    <!-- 相簿切換按鈕區域 -->
                    <div id="album-tabs" class="flex flex-wrap justify-center gap-2 mb-8">
                        <!-- 由 JS 動態生成 -->
                    </div>
                </div>
                
                <!-- 照片網格 -->
                <div id="photo-gallery" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- 載入中骨架屏 -->
                    <div class="animate-pulse bg-gray-200 h-64 rounded-2xl"></div>
                    <div class="animate-pulse bg-gray-200 h-64 rounded-2xl"></div>
                    <div class="animate-pulse bg-gray-200 h-64 rounded-2xl"></div>
                </div>
            </div>
        </section>

        <!-- 簡易燈箱 (Lightbox) -->
        <div id="lightbox" class="fixed inset-0 z-[100] bg-black/90 hidden flex items-center justify-center p-4 cursor-zoom-out" onclick="closeLightbox()">
            <img id="lightbox-img" src="" class="max-w-full max-h-full rounded-lg shadow-2xl transition-transform duration-300">
            <p id="lightbox-caption" class="absolute bottom-8 text-white font-medium"></p>
            <button class="absolute top-8 right-8 text-white text-4xl">&times;</button>
        </div>
    </section>
    
    <!-- tab: about -->
    <section id="tab-about" class="tab-content hidden" aria-hidden="true">
        <div class="calendar-card">
            <h3>說明</h3>
            <p>此介面可瀏覽與預約時段。切換至「設定」可檢視 API host，並手動重新載入時段。</p>
        </div>
    </section>
</div>

<script>
    // 指定固定 server host（所有 API 請求都發到此主機）
    const baseUrl = 'https://mysite-e425.onrender.com';

    document.addEventListener('DOMContentLoaded', function() {
        // 更新授權連結
        const authLink = document.getElementById('auth-link');
        if (authLink) authLink.href = `${baseUrl}/authorize`;

        // 初始化日曆
        initCalendar();
        loadAlbums();
    });

    function initCalendar() {
        const calendarEl = document.getElementById('calendar');
        const now = new Date();

        // 限制：前兩天以前不能看
        const minDate = new Date();
        minDate.setDate(now.getDate() - 2);
        minDate.setHours(0, 0, 0, 0);

        // 限制：最多選到 30 天後
        const maxDate = new Date();
        maxDate.setDate(now.getDate() + 30);

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGrid',
            validRange: { start: minDate, end: maxDate },
            views: { timeGrid: { dayCount: 7, titleFormat: { year: 'numeric', month: 'long' } } },
            locale: 'zh-tw',
            slotMinTime: '08:00:00',
            slotMaxTime: '21:00:00',
            slotDuration: '01:00:00',
            allDaySlot: false,
            selectable: true,
            nowIndicator: true,
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: ''
            },

            // 串接後端 get-slots API，並加上時間戳記防止快取
            events: function(info, successCallback, failureCallback) {
                const timestamp = new Date().getTime();
                // 使用 .toISOString() 轉換為 UTC 格式 (會自動帶上 Z)
                const startUTC = new Date(info.startStr).toISOString();
                const endUTC = new Date(info.endStr).toISOString();

                const url = `${baseUrl}/api/get-slots?_=${timestamp}&start=${encodeURIComponent(startUTC)}&end=${encodeURIComponent(endUTC)}`;
        
                fetch(url)
                    .then(response => response.json())
                    .then(data => successCallback(data))
                    .catch(error => {
                        console.error('Fetch slots error:', error);
                        failureCallback(error);
                    });
            },

            eventSources: [
                {
                    events: [
                        {
                            groupId: 'lunchBreak',
                            daysOfWeek: [0,1,2,3,4,5,6],
                            startTime: '12:00:00',
                            endTime: '13:00:00',
                            display: 'background',
                            classNames: ['break-time-bg']
                        },
                        {
                            title: '休息時間',
                            daysOfWeek: [0,1,2,3,4,5,6],
                            startTime: '12:00:00',
                            endTime: '13:00:00',
                            display: 'block',
                            color: 'transparent',
                            textColor: '#94a3b8',
                            classNames: ['break-time-event']
                        }
                    ]
                }
            ],

            select: function(info) {
                const selectStart = info.start;
                const selectEnd = info.end;
                
                if (selectStart.getHours() === 12 || (selectStart.getHours() < 12 && selectEnd.getHours() > 12)) {
                    alert('12:00 - 13:00 為休息時間。');
                    calendar.unselect();
                    return;
                }

                if (selectStart < now) {
                    alert('無法預約過去的時間。');
                    calendar.unselect();
                    return;
                }

                const timeStr = selectStart.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                if(confirm(`確認預約 ${timeStr} 嗎？`)) {
                    calendar.addEvent({
                        title: '您的預約',
                        start: info.start,
                        end: info.end,
                        color: '#3b82f6'
                    });
                }
                calendar.unselect();
            }
        });

        calendar.render();

    }
    async function loadAlbums(userToken) {
        const gallery = document.getElementById('photo-gallery');
        const tabsContainer = document.getElementById('album-tabs');
        
        try {
            const response = await fetch(`${baseUrl}/api/get-albums`, );
            albumData = await response.json();
            
            if (albumData.error) throw new Error(albumData.error);

            // 1. 生成相簿分頁標籤
            tabsContainer.innerHTML = albumData.map((album, index) => `
                <button onclick="displayAlbum(${index})" 
                        class="album-tab px-6 py-2 rounded-full font-bold transition-all ${index === 0 ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-600 hover:bg-slate-100'}">
                    ${album.albumName} (${album.photos.length})
                </button>
            `).join('');

            // 2. 預設顯示第一個相簿
            if (albumData.length > 0) displayAlbum(0);

        } catch (error) {
            gallery.innerHTML = `<p class="col-span-full text-center text-red-500">載入失敗: ${error.message}</p>`;
        }
    }

    function displayAlbum(index) {
        const gallery = document.getElementById('photo-gallery');
        const album = albumData[index];
        
        // 更新 Tab 樣式
        document.querySelectorAll('.album-tab').forEach((btn, i) => {
            if(i === index) {
                btn.classList.add('bg-blue-600', 'text-white', 'shadow-lg');
                btn.classList.remove('bg-white', 'text-slate-600');
            } else {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
                btn.classList.add('bg-white', 'text-slate-600');
            }
        });

        // 渲染照片
        gallery.innerHTML = album.photos.map(photo => `
            <div class="group relative overflow-hidden rounded-2xl bg-white shadow-sm hover:shadow-xl transition-all cursor-pointer" 
                 onclick="openLightbox('${photo.url}', '${photo.name}')">
                <img src="${photo.thumb}" alt="${photo.name}" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                    <i class="fa-solid fa-magnifying-glass-plus text-white text-2xl"></i>
                </div>
            </div>
        `).join('');
    }

    function openLightbox(url, name) {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        const cap = document.getElementById('lightbox-caption');
        img.src = url;
        cap.innerText = name;
        lb.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.add('hidden');
        document.body.style.overflow = 'auto';
    }

    // 切換標籤頁
    document.querySelectorAll('.nav-link').forEach(tab => {
        tab.addEventListener('click', function(e) {
            e.preventDefault();
            
            // 取得目標標籤頁 ID
            const targetTab = this.getAttribute('data-tab');

            // 切換標籤樣式
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            this.classList.add('active');

            // 隱藏所有標籤內容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
                content.setAttribute('aria-hidden', 'true');
            });

            // 顯示目標標籤內容
            const activeTabContent = document.getElementById(targetTab);
            if (activeTabContent) {
                activeTabContent.classList.remove('hidden');
                activeTabContent.setAttribute('aria-hidden', 'false');
            }
        });
    });

    // 重新載入時段按鈕
    document.getElementById('refresh-slots').addEventListener('click', function() {
        const calendar = FullCalendar.getInstanceById('calendar');
        if (calendar) {
            calendar.refetchEvents();
        }
    });

</script>

</body>
</html>

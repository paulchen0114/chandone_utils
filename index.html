<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代化預約系統</title>
    
    <!-- 引入 FullCalendar 6 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-gray: #f8fafc;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --break-pattern: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 10px, #f8fafc 10px, #f8fafc 20px);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-gray);
            color: var(--text-main);
            line-height: 1.5;
        }

        .app-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section h1 {
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* navbar */
        .nav-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0 20px;
        }

        .nav-link {
            padding: 8px 14px;
            border-radius: 8px;
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-link:hover {
            background-color: #f1f5f9;
        }

        .nav-link.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 側邊圖例 */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* 日曆容器 */
        .calendar-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 24px;
            border: 1px solid var(--border);
        }

        /* FullCalendar 深度美化 */
        .fc {
            --fc-border-color: #f1f5f9;
            --fc-button-bg-color: #ffffff;
            --fc-button-border-color: #e2e8f0;
            --fc-button-text-color: #475569;
            --fc-button-hover-bg-color: #f8fafc;
            --fc-button-active-bg-color: #f1f5f9;
            --fc-today-bg-color: #eff6ff;
        }

        .fc .fc-toolbar-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .fc .fc-button {
            font-weight: 500;
            text-transform: capitalize;
            padding: 8px 16px;
            box-shadow: none !important;
        }

        .fc .fc-button-primary:not(:disabled).fc-button-active, 
        .fc .fc-button-primary:not(:disabled):active {
            color: var(--primary);
            background-color: #eff6ff;
            border-color: var(--primary);
        }

        .fc .fc-col-header-cell {
            padding: 12px 0;
            background-color: #fcfcfd;
            font-weight: 600;
        }

        .fc-timegrid-slot {
            height: 4.5em !important;
        }

        .fc-timegrid-slot-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 休息時段樣式 */
        .break-time-bg {
            background: var(--break-pattern) !important;
            opacity: 0.8;
        }

        .break-time-event {
            border: none !important;
            box-shadow: none !important;
            pointer-events: none;
        }

        /* 選取範圍樣式 */
        .fc-highlight {
            background: rgba(59, 130, 246, 0.1) !important;
        }

        /* 簡單的 tab / navbar 樣式 */
        .nav-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0 20px;
        }
        .nav-link {
            padding: 8px 14px;
            border-radius: 8px;
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-link.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .tab-content { display: block; }
        .tab-content.hidden { display: none; }

        /* 相簿圖片容器優化 */
        .photo-card {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            position: relative;
            border-radius: 16px;
            background: #eee;
            cursor: pointer;
        }
        
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .photo-card:hover img {
            transform: scale(1.1);
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            padding: 16px;
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        /* 骨架屏 */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<div class="app-container">
    

    <!-- navbar for tabs -->
    <nav class="nav-tabs" role="tablist" aria-label="主選單">
        <a class="nav-link active" data-tab="tab-calendar" href="#" role="tab">預約日曆</a>
        <a class="nav-link" data-tab="tab-settings" href="#" role="tab">相簿</a>
        <a class="nav-link" data-tab="tab-about" href="#" role="tab">說明</a>
    </nav>
    
    <!-- 授權連結（會由腳本填入正確的 base URL） -->
    <div style="text-align: right; margin-bottom: 12px;">
        <a id="auth-link" href="https://mysite-e425.onrender.com/authorize" class="auth-button">授權</a>
    </div>
    
    <!-- tab: calendar -->
    <section id="tab-calendar" class="tab-content">
        <div class="header-section">
            <h1>預約時段查詢</h1>
            <p>選擇一個合適的時間，開啟您的服務行程</p>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="dot" style="background: #cbd5e1;"></span> 忙碌/已過期</div>
            <div class="legend-item"><span class="dot" style="background: #f1f5f9; border: 1px dashed #cbd5e1;"></span> 休息時間</div>
            <div class="legend-item"><span class="dot" style="background: var(--primary);"></span> 您的選擇</div>
        </div>
        <div class="calendar-card">
            <div id="calendar"></div>
        </div>
    </section>
    
   <!-- 2. 相簿 Tab -->
    <section id="tab-settings" class="tab-content hidden">
        <div class="py-6">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold text-slate-900 mb-2">數位專案相簿</h2>
                <p class="text-slate-500 mb-8">展示工作室近期開發之視覺樣式與 UI 成果</p>
                <div id="album-tabs" class="flex flex-wrap justify-center gap-3">
                    <!-- JS 動態生成 -->
                </div>
            </div>
            
            <!-- 照片網格佈局優化：使用 Tailwind 網格 -->
            <div id="photo-gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- 預設顯示載入狀態 -->
                <div class="photo-card skeleton"></div>
                <div class="photo-card skeleton"></div>
                <div class="photo-card skeleton"></div>
                <div class="photo-card skeleton"></div>
            </div>
        </div>
    </section>
    
    <!-- tab: about -->
    <section id="tab-about" class="tab-content hidden" aria-hidden="true">
        <div class="calendar-card">
            <h3>說明</h3>
            <p>此介面可瀏覽與預約時段。切換至「設定」可檢視 API host，並手動重新載入時段。</p>
        </div>
    </section>
</div>
<!-- 燈箱優化 -->
<div id="lightbox" class="fixed inset-0 z-[100] bg-slate-950/95 hidden backdrop-blur-sm flex items-center justify-center p-4 cursor-zoom-out" onclick="closeLightbox()">
    <div class="relative max-w-5xl w-full flex flex-col items-center">
        <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain animate-in zoom-in duration-300">
        <div class="mt-4 text-center">
            <p id="lightbox-caption" class="text-white text-lg font-medium"></p>
        </div>
        <button class="absolute -top-12 right-0 text-white/70 hover:text-white text-4xl transition">&times;</button>
    </div>
</div>


<script>
    // 指定固定 server host（所有 API 請求都發到此主機）
    const baseUrl = 'https://mysite-e425.onrender.com';

    document.addEventListener('DOMContentLoaded', function() {
        // 更新授權連結
        const authLink = document.getElementById('auth-link');
        if (authLink) authLink.href = `${baseUrl}/authorize`;

        // 初始化日曆
        initCalendar();
        loadAlbums();
    });

    function initCalendar() {
        const calendarEl = document.getElementById('calendar');
        const now = new Date();

        // 限制：前兩天以前不能看
        const minDate = new Date();
        minDate.setDate(now.getDate() - 2);
        minDate.setHours(0, 0, 0, 0);

        // 限制：最多選到 30 天後
        const maxDate = new Date();
        maxDate.setDate(now.getDate() + 30);

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGrid',
            validRange: { start: minDate, end: maxDate },
            views: { timeGrid: { dayCount: 7, titleFormat: { year: 'numeric', month: 'long' } } },
            locale: 'zh-tw',
            slotMinTime: '08:00:00',
            slotMaxTime: '21:00:00',
            slotDuration: '01:00:00',
            allDaySlot: false,
            selectable: true,
            nowIndicator: true,
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: ''
            },

            // 串接後端 get-slots API，並加上時間戳記防止快取
            events: function(info, successCallback, failureCallback) {
                const timestamp = new Date().getTime();
                // 使用 .toISOString() 轉換為 UTC 格式 (會自動帶上 Z)
                const startUTC = new Date(info.startStr).toISOString();
                const endUTC = new Date(info.endStr).toISOString();

                const url = `${baseUrl}/api/get-slots?_=${timestamp}&start=${encodeURIComponent(startUTC)}&end=${encodeURIComponent(endUTC)}`;
        
                fetch(url)
                    .then(response => response.json())
                    .then(data => successCallback(data))
                    .catch(error => {
                        console.error('Fetch slots error:', error);
                        failureCallback(error);
                    });
            },

            eventSources: [
                {
                    events: [
                        {
                            groupId: 'lunchBreak',
                            daysOfWeek: [0,1,2,3,4,5,6],
                            startTime: '12:00:00',
                            endTime: '13:00:00',
                            display: 'background',
                            classNames: ['break-time-bg']
                        },
                        {
                            title: '休息時間',
                            daysOfWeek: [0,1,2,3,4,5,6],
                            startTime: '12:00:00',
                            endTime: '13:00:00',
                            display: 'block',
                            color: 'transparent',
                            textColor: '#94a3b8',
                            classNames: ['break-time-event']
                        }
                    ]
                }
            ],

            select: function(info) {
                const selectStart = info.start;
                const selectEnd = info.end;
                
                if (selectStart.getHours() === 12 || (selectStart.getHours() < 12 && selectEnd.getHours() > 12)) {
                    alert('12:00 - 13:00 為休息時間。');
                    calendar.unselect();
                    return;
                }

                if (selectStart < now) {
                    alert('無法預約過去的時間。');
                    calendar.unselect();
                    return;
                }

                const timeStr = selectStart.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                if(confirm(`確認預約 ${timeStr} 嗎？`)) {
                    calendar.addEvent({
                        title: '您的預約',
                        start: info.start,
                        end: info.end,
                        color: '#3b82f6'
                    });
                }
                calendar.unselect();
            }
        });

        calendar.render();

    }
    async function loadAlbums() {
        const gallery = document.getElementById('photo-gallery');
        const tabsContainer = document.getElementById('album-tabs');
        
         try {
            // 嘗試從 localStorage 獲取 Token (若有授權流程)
            const token = localStorage.getItem('userToken'); 
            
            const response = await fetch(`${baseUrl}/api/get-albums`);
            const data = await response.json();
            
            if (data.error) throw new Error(data.error);
            
            // 修正：賦值給全域變數
            albumData = data;

            if (albumData.length === 0) {
                gallery.innerHTML = `<p class="col-span-full text-center py-20 text-slate-400">目前沒有可顯示的相簿資料。</p>`;
                return;
            }

            // 1. 生成標籤
            tabsContainer.innerHTML = albumData.map((album, index) => `
                <button onclick="displayAlbum(${index})" 
                        class="album-btn px-5 py-2 rounded-xl text-sm font-bold transition-all border ${index === 0 ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-200 text-slate-600 hover:border-blue-300'}">
                    ${album.albumName} <span class="ml-1 opacity-60 font-normal">${album.photos.length}</span>
                </button>
            `).join('');

            // 2. 顯示第一本相簿
            displayAlbum(0);

        } catch (error) {
            console.error("Album Load Error:", error);
            gallery.innerHTML = `<div class="col-span-full text-center py-20">
                <p class="text-red-500 font-medium mb-2">載入失敗: ${error.message}</p>
                <button onclick="loadAlbums()" class="text-blue-600 underline">重新嘗試</button>
            </div>`;
        }
    }

    function displayAlbum(index) {
        const gallery = document.getElementById('photo-gallery');
        const album = albumData[index];
        if (!album) return;
        
        // 更新按鈕樣式
        document.querySelectorAll('.album-btn').forEach((btn, i) => {
            if(i === index) {
                btn.className = "album-btn px-5 py-2 rounded-xl text-sm font-bold transition-all border bg-blue-600 border-blue-600 text-white shadow-md";
            } else {
                btn.className = "album-btn px-5 py-2 rounded-xl text-sm font-bold transition-all border bg-white border-slate-200 text-slate-600 hover:border-blue-300";
            }
        });

        // 渲染照片
        gallery.innerHTML = album.photos.map(photo => `
            <div class="photo-card shadow-sm hover:shadow-2xl transition-all" onclick="openLightbox('${photo.url}', '${photo.name}')">
                <img src="${photo.thumb || photo.url}" alt="${photo.name}" loading="lazy">
                <div class="photo-overlay">
                    <span class="text-white text-sm font-medium truncate w-full">${photo.name}</span>
                </div>
            </div>
        `).join('');
    }

    function openLightbox(url, name) {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        const cap = document.getElementById('lightbox-caption');
        img.src = url;
        cap.innerText = name;
        lb.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.add('hidden');
        document.body.style.overflow = 'auto';
    }

    // 切換標籤頁
    document.querySelectorAll('.nav-link').forEach(tab => {
        tab.addEventListener('click', function(e) {
            e.preventDefault();
            
            // 取得目標標籤頁 ID
            const targetTab = this.getAttribute('data-tab');

            // 切換標籤樣式
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            this.classList.add('active');

            // 隱藏所有標籤內容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
                content.setAttribute('aria-hidden', 'true');
            });

            // 顯示目標標籤內容
            const activeTabContent = document.getElementById(targetTab);
            if (activeTabContent) {
                activeTabContent.classList.remove('hidden');
                activeTabContent.setAttribute('aria-hidden', 'false');
            }

            // 如果回到日曆，讓 FullCalendar 更新大小
            if (targetTab === 'tab-calendar' && window.calendar && typeof window.calendar.updateSize === 'function') {
                setTimeout(() => window.calendar.updateSize(), 50);
            }

            // 如果切到相簿，自動載入相簿
            if (targetTab === 'tab-settings') {
                const userToken = window.userToken || localStorage.getItem('userToken') || null;
                if (typeof loadAlbums === 'function') loadAlbums();
            }
        });
    });

</script>

</body>
</html>
